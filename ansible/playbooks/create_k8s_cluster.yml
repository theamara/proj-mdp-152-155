---
- name: Create Kubernetes cluster with kops
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create cluster
      shell: |
        kops create cluster \
          --name=mycluster.k8s.local \
          --zones=us-east-1a,us-east-1b \
          --node-count=2 \
          --node-size=t3.medium \
          --master-count=1 \
          --master-size=t3.medium \
          --yes
      environment:
        KOPS_STATE_STORE: "{{ lookup('env', 'KOPS_STATE_STORE') }}"
        AWS_REGION: "{{ lookup('env', 'AWS_REGION') }}"
